# Project Robin · Netlify configuration
# Plataforma de alumnos y administracion (funciones serverless + Supabase)

[build]
  # Fuerza la raíz del repositorio y anula el antiguo directorio base guardado en Netlify.
  base = "."
  publish = "dist"
  functions = "netlify/functions"
  # Publica solo el frontend generado; el código fuente queda fuera del directorio público.
  command = "npm run build"

[dev]
  framework = "#custom"
  command = "vite --host 127.0.0.1 --port 5173"
  targetPort = 5173
  port = 8888
  autoLaunch = false

