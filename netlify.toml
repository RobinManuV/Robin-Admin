# ---------- Fallback SPA del gestor ----------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------- Headers de seguridad ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'nonce-robin-vite'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; frame-src https://project-robin.com https://www.project-robin.com https://robinwebv2.netlify.app; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las funciones nunca se cachean
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# ---------- Función programada: recoge transcripciones de Meet desde Drive ----------
[functions."meet-transcript-poll"]
  schedule = "*/15 * * * *"

# ---------- Función programada: borrado semanal (rolling >7 días) del chat con IA ----------
[functions."chat-cleanup"]
  schedule = "0 3 * * *"

# ---------- Reintentos idempotentes de integraciones empresariales ----------
[functions."integration-retry"]
  schedule = "*/10 * * * *"

# ---------- Histórico diario de Tesorería (23:59 Europe/Madrid, CET/CEST) ----------
[functions."finance-treasury-snapshot"]
  schedule = "59 * * * *"

# ---------- Retención de analítica web: elimina eventos con más de 14 meses ----------
[functions."web-retention"]
  schedule = "30 4 * * *"
